name: Autonomy Score

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomy-score-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

  score:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scorer
        run: python -m pip install -e .

      - name: Score pull request diff
        shell: bash
        run: |
          git diff --unified=3 "origin/${{ github.base_ref }}...HEAD" > pr.diff
          autonomy-score --diff pr.diff --format markdown | tee autonomy-report.md
          cat autonomy-report.md >> "$GITHUB_STEP_SUMMARY"
