name: Autonomy Score

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomy-score-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e . build twine

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Validate package distribution
        run: |
          python -m build
          python -m twine check dist/*
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
          autonomy-score --help

  # Keep the protected-branch check name stable while requiring every matrix
  # member, including Windows, to complete successfully.
  test:
    name: test
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all test environments to pass
        run: test "${{ needs.test-matrix.result }}" = "success"

  score:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scorer
        run: python -m pip install -e .

      - name: Score pull request diff
        shell: bash
        run: |
          git diff --unified=3 "origin/${{ github.base_ref }}...HEAD" > pr.diff
          autonomy-score --diff pr.diff --format markdown | tee autonomy-report.md
          cat autonomy-report.md >> "$GITHUB_STEP_SUMMARY"
