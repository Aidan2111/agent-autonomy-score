[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-autonomy-score"
version = "0.2.0"
description = "Risk scoring for deciding how much supervision AI coding agents need."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aidan Marshall" }]
keywords = [
  "ai-agents",
  "agentic-sdlc",
  "code-review",
  "developer-tools",
  "risk-scoring"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.68.0"]

[project.urls]
Homepage = "https://github.com/Aidan2111/agent-autonomy-score"
Repository = "https://github.com/Aidan2111/agent-autonomy-score"
Issues = "https://github.com/Aidan2111/agent-autonomy-score/issues"
Documentation = "https://github.com/Aidan2111/agent-autonomy-score#readme"
Changelog = "https://github.com/Aidan2111/agent-autonomy-score/blob/main/CHANGELOG.md"

[project.scripts]
autonomy-score = "autonomy_score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
